name: Discover

# Hourly: collect, deduplicate, verify, then re-rank so new items are scored.
# Runs on GitHub's schedule; no browser or session has to be open.
#
# Scheduled for every hour because GitHub starts scheduled runs late and skips
# many under load: with a three-hour cron, only about half of the slots ran,
# leaving gaps of up to seven hours. The pipeline's concurrency group stops runs
# from overlapping. Schedules are also paused after 60 days without activity.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    secrets: inherit
    with:
      commands: discover verify rank trends curate
