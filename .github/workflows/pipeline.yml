# Reusable pipeline runner. The scheduled workflows call this with the list of
# jobs to run, so database handling lives in one place.
#
# Storage is chosen by configuration:
#   * DATABASE_URL secret set  -> Postgres (Supabase or any other host).
#   * DATABASE_URL not set     -> the embedded store, restored from and saved
#                                 back to the `data` branch of this repository.
name: Pipeline

on:
  workflow_call:
    inputs:
      commands:
        description: Space-separated pipeline commands (discover verify rank trends curate maintain)
        required: true
        type: string

permissions:
  contents: read

# One pipeline run at a time: two writers on one store would race.
concurrency:
  group: signal-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used to update the `data` branch in embedded mode
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The built-in token is enough for public repository metadata.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'extractive' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      AI_MAX_ITEMS_PER_RUN: ${{ vars.AI_MAX_ITEMS_PER_RUN || '40' }}
      # Set to 0 for one run to force every record back through verification after a classifier change.
      VERIFY_MAX_AGE_HOURS: ${{ vars.VERIFY_MAX_AGE_HOURS }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || format('https://github.com/{0}', github.repository) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Restore embedded store from the data branch
        if: env.DATABASE_URL == ''
        run: |
          if ! git fetch --depth 1 origin data 2>/dev/null; then
            echo "No data branch yet; starting with an empty store."
            exit 0
          fi
          # The store is saved whole, or split into parts when it nears GitHub's 100 MB file limit.
          parts=$(git ls-tree --name-only FETCH_HEAD | grep -E '^store\.tar\.gz(\.part-[a-z]+)?$' | sort)
          if [ -z "$parts" ]; then
            echo "::error::The data branch exists but holds no store file. Refusing to start from an empty store and overwrite it."
            exit 1
          fi
          : > "$RUNNER_TEMP/store.tar.gz"
          for part in $parts; do git show "FETCH_HEAD:$part" >> "$RUNNER_TEMP/store.tar.gz"; done
          npm run datastore -- unpack "$RUNNER_TEMP/store.tar.gz"

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run pipeline
        env:
          COMMANDS: ${{ inputs.commands }}
        run: |
          status=0
          for command in $COMMANDS; do
            case "$command" in
              discover|verify|rank|trends|curate|maintain) ;;
              *) echo "Unknown command: $command"; exit 2 ;;
            esac
            echo "::group::$command"
            # A failed stage is reported but later stages still run on the data that exists.
            npx tsx scripts/run.ts "$command" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Pipeline status'
            echo '```json'
            npx tsx scripts/run.ts status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export snapshot
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          npx tsx scripts/run.ts export "$RUNNER_TEMP/data/snapshot.json"

      # The static site is the Artifact page as a complete document. Republishing it
      # after every run is what keeps a public page current with no machine switched on.
      - name: Build static site
        if: always() && vars.PUBLISH_SITE == 'true'
        run: npx tsx scripts/build-artifact.ts --snapshot "$RUNNER_TEMP/data/snapshot.json" --out "$RUNNER_TEMP/artifact" --site "$RUNNER_TEMP/site"

      - name: Upload static site
        if: always() && vars.PUBLISH_SITE == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Save embedded store and snapshot to the data branch
        if: always() && env.DATABASE_URL == ''
        run: |
          out="$RUNNER_TEMP/data"
          npm run datastore -- pack "$out/store.tar.gz"
          cd "$out"
          # GitHub rejects any file over 100 MB. Split well below that so growth can never block a save again.
          size=$(stat -c %s store.tar.gz)
          echo "Store is $((size / 1048576)) MB compressed"
          if [ "$size" -gt $((90 * 1048576)) ]; then
            split -b 90m -a 2 store.tar.gz store.tar.gz.part-
            rm store.tar.gz
            echo "::warning::The embedded store is over 90 MB and was split into parts. Consider moving to hosted Postgres (DATABASE_URL)."
          fi
          git init -q -b data
          git add store.tar.gz* snapshot.json
          git -c user.name="signal-pipeline" -c user.email="actions@users.noreply.github.com" commit -q -m "data: pipeline state $(date -u +%Y-%m-%dT%H:%MZ)"
          # A single-commit branch, replaced each run, so history does not accumulate binary blobs.
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

  publish-site:
    name: Publish static site
    # Opt-in: set the repository variable PUBLISH_SITE=true and enable GitHub Pages (source: GitHub Actions).
    if: always() && vars.PUBLISH_SITE == 'true'
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
