name: Daily curation

# Once a day: full re-rank, featured story and the weekly "What You Missed" edition.
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    secrets: inherit
    with:
      commands: rank trends curate
